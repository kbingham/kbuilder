#
# Namespaces used by systemd service sandboxing
#

CONFIG_NAMESPACES=y
CONFIG_UTS_NS=y
CONFIG_IPC_NS=y
CONFIG_PID_NS=y
CONFIG_NET_NS=y
CONFIG_USER_NS=y

#
# systemd service security/sandboxing
#

CONFIG_SECCOMP=y
CONFIG_SECCOMP_FILTER=y

#
# Credentials, capabilities and process inspection
#

CONFIG_MULTIUSER=y
CONFIG_POSIX_TIMERS=y
CONFIG_ADVISE_SYSCALLS=y
CONFIG_MEMFD_CREATE=y

CONFIG_AUTOFS_FS=y

CONFIG_CGROUPS=y
CONFIG_CGROUP_PIDS=y
CONFIG_CGROUP_SCHED=y
CONFIG_FAIR_GROUP_SCHED=y
CONFIG_CFS_BANDWIDTH=y
CONFIG_MEMCG=y
CONFIG_CPUSETS=y
CONFIG_CGROUP_FREEZER=y

CONFIG_RT_GROUP_SCHED=n

CONFIG_INOTIFY_USER=y
